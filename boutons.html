<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e14">
<title>First Note : le bouton Jouer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --encre: #0f0e14; --texte: #f3efe6; --discret: #a7a1b2; --or: #e9c27a; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #07060a; color: var(--texte); font: 15px/1.45 "Inter", system-ui, sans-serif; }
main { max-width: 430px; margin: 0 auto; padding: 26px 0 60px; }
h1 { font-family: "Fraunces", Georgia, serif; font-size: 1.7rem; margin: 0 18px 4px; }
.intro { color: var(--discret); margin: 0 18px 22px; }
article { margin-bottom: 30px; }
article h2 { font-family: "Fraunces", Georgia, serif; font-size: 1.15rem; margin: 0 18px; }
article h2 span { color: var(--or); margin-right: 8px; }
article p { color: var(--discret); font-size: .86rem; margin: 2px 18px 10px; }
article a { display: block; margin: 10px 18px 0; color: var(--or); font-size: .9rem; font-weight: 500; text-decoration: none; }
/* le bas de l'écran d'accueil, reproduit : repères, bouton, menu */
.bas { position: relative; background: radial-gradient(120% 90% at 50% 0, #1d1a29, var(--encre) 75%); border-top: 1px solid rgba(255, 255, 255, .08); border-bottom: 1px solid rgba(255, 255, 255, .08); padding: 22px 18px 0; }
.reperes { display: flex; justify-content: center; gap: 26px; margin-bottom: 47px; text-align: center; }
.reperes small { display: block; font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; color: var(--discret); }
.reperes b { font-family: "Fraunces", Georgia, serif; font-size: 2.1rem; line-height: 1.05; background: linear-gradient(180deg, #fff3d6, var(--or)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.reperes i { width: 1px; background: rgba(255, 255, 255, .12); }
.b { display: grid; place-items: center; width: 100%; height: 84px; border: 0; border-radius: 24px; padding: 0; cursor: pointer; transition: transform .12s; font: inherit; }
.b:active { transform: scale(.97); }
.menu { display: grid; grid-template-columns: repeat(4, 1fr); margin: 47px -18px 0; padding: 10px 10px 12px; border-top: 1px solid rgba(255, 255, 255, .12); color: var(--discret); font-size: .68rem; font-weight: 500; text-align: center; }
.menu span:first-child { color: var(--or); }
</style>
</head>
<body>
<main>
  <h1>Le bouton Jouer</h1>
  <p class="intro">Les couleurs de l'Encre sont gardées. Huit essais de police pour le mot, posés sur le bas de l'écran d'accueil. Le lien sous chacune l'ouvre dans la vraie appli.</p>
  <div id="pistes"></div>
</main>
<script src="marbre.js?v=59"></script>
<script>
const TEXTES = [
  "Géométrique, ronde, très lisible.",
  "Géométrique, un peu plus technique et large.",
  "Plus de caractère, des formes inattendues.",
  "Très large et ronde, un côté jeu assumé.",
  "Grotesque vivante, serrée, de la personnalité.",
  "Sobre et dense, la plus neutre des six.",
  "Outfit, le mot posé sur une pastille sombre : les lignes passent partout autour.",
  "Unbounded, sur la même pastille sombre.",
];
const zone = document.getElementById("pistes");
MARBRES.forEach((v, i) => {
  const a = document.createElement("article");
  a.innerHTML = `<h2><span>${i + 1}</span>${v.nom}</h2><p>${TEXTES[i]}</p>
    <div class="bas"><div class="reperes"><div><small>record</small><b>1240</b></div><i></i><div><small>morceaux</small><b>11</b></div></div>
    <button class="b">Jouer</button>
    <div class="menu"><span>Jouer</span><span>Playlist</span><span>Classement</span><span>Profil</span></div></div>
    <a href="./?bouton=${i + 1}">Voir dans l'appli →</a>`;
  zone.appendChild(a);
  marbrer(a.querySelector(".b"), i + 1);
});
</script>
</body>
</html>
