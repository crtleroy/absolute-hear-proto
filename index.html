<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e14">
<title>First Note: Perfect Pitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="First Note">
<link rel="stylesheet" href="style.css?v=46">
</head>
<body>
<div id="app">
  <div class="ecrans">

    <section id="ecran-jouer" class="ecran actif">
      <div id="accueil" class="accueil">
        <p class="surtitre marque"><img src="logo-signe.svg" alt="" width="26" height="26">First Note</p>
        <div class="jauge-oreille">
          <p class="jauge-chiffre"><b id="acc-jauge">0</b><span>%</span></p>
          <p class="jauge-nom">oreille absolue</p>
          <div id="acc-clavier" class="grand-clavier" aria-hidden="true"></div>
          <p id="acc-touches" class="jauge-touches"></p>
        </div>
        <div class="reperes">
          <div><small>record</small><b id="acc-record">0</b></div>
          <i></i>
          <div><small>morceaux</small><b><span id="acc-liste">2</span><em id="acc-total"></em></b></div>
        </div>
        <button id="lancer" class="bouton plein grand">Jouer</button>
      </div>

      <div id="partie" class="partie" hidden>
        <div class="scores"><span id="vies" class="vies"></span><span id="avance"></span><span><b id="score">0</b> pts</span></div>
        <div class="tete">
          <div class="houle" aria-hidden="true"><i></i><i></i><i></i></div>
          <p id="question" class="question"></p>
          <p id="fil" class="fil"></p>
          <div id="jauge" class="jauge"></div>
          <p id="enjeu" class="enjeu"></p>
        </div>
        <div id="reponses" class="reponses"></div>
        <div class="commandes">
          <button id="plus" class="cote"><b>+1</b><small>note</small></button>
          <button id="orbe" class="orbe" aria-label="Écouter la note">
            <span class="onde"></span><span class="onde"></span>
            <svg viewBox="0 0 24 24" width="40" height="40" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button id="aide-ecoute" class="cote"><b>♪♪♪</b><small>le début</small></button>
        </div>
      </div>

      <canvas id="rincage" class="rincage" hidden aria-hidden="true"></canvas>
      <p id="rincage-texte" class="rincage-texte" hidden></p>

      <div id="fin" class="fin" hidden>
        <canvas id="fete" class="fete" aria-hidden="true"></canvas>
        <p id="fin-sur" class="surtitre"></p>
        <h2 id="fin-titre"></h2>
        <p id="fin-vies" class="vies fin-vies"></p>
        <div id="fin-carte" class="nouveau" hidden>
          <button id="fin-pastille" class="medaillon" aria-label="Écouter la note"></button>
          <p id="fin-touche" class="fin-touche"></p>
          <b id="fin-morceau"></b>
          <small id="fin-comp"></small>
        </div>
        <div class="score-fin"><p id="fin-record" class="record" hidden>Nouveau record</p><b id="fin-score">0</b><small>points</small></div>
        <button id="rejouer" class="bouton plein grand">Continuer</button>
      </div>
    </section>

    <section id="ecran-profil" class="ecran"></section>
    <section id="ecran-classement" class="ecran"></section>

    <section id="ecran-liste" class="ecran">
      <div class="pl-tete">
        <div id="pl-pochette" class="pl-pochette" aria-hidden="true"></div>
        <div class="pl-titre"><p class="surtitre">Playlist</p><h2>Mes morceaux</h2><p id="pl-resume" class="indice"></p></div>
      </div>
      <div class="pl-commandes">
        <button id="pl-tri" class="pl-tri"></button>
        <button id="pl-lire" class="pl-lire" aria-label="Lire la playlist"></button>
      </div>
      <div id="pl-liste" class="liste"></div>
    </section>
  </div>

  <div id="mini" class="mini" hidden>
    <span id="mini-pastille" class="pastille"></span>
    <button id="mini-ouvrir" class="mini-texte"><b id="mini-titre"></b><small id="mini-comp"></small></button>
    <button id="mini-lecture" class="rond" aria-label="Lecture ou pause"></button>
    <button id="mini-debut" class="rond discret" aria-label="Retour au début"><svg viewBox="0 0 24 24" width="46%" height="46%" fill="currentColor"><path d="M18 5v14l-9-7zM5.5 5H8v14H5.5z"/></svg></button>
    <span id="mini-barre" class="mini-barre"></span>
  </div>

  <nav class="onglets">
    <button data-ecran="jouer" class="actif">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
      <span>Jouer</span>
    </button>
    <button data-ecran="liste">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h11M4 12h11M4 17h7"/><path d="M19 9v7.5"/><circle cx="17" cy="17" r="2"/></svg>
      <span>Playlist<i id="pl-badge"></i></span>
    </button>
    <button data-ecran="classement">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg>
      <span>Classement</span>
    </button>
    <button data-ecran="profil">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.6"/><path d="M5 20c.8-3.6 3.6-5.4 7-5.4s6.2 1.8 7 5.4"/></svg>
      <span>Profil</span>
    </button>
  </nav>

  <div id="feuille" class="feuille" hidden>
    <div id="feuille-fond" class="feuille-fond"></div>
    <div class="feuille-panneau">
      <div id="f-partition" class="partition-fond" aria-hidden="true"></div>
      <div class="f-contenu">
        <div id="f-resultat" class="f-resultat">
          <p id="f-points" class="f-points"></p>
          <p id="f-detail" class="f-detail"></p>
          <span id="f-pips" class="pips"></span>
        </div>
        <button id="f-pastille" class="medaillon moyen" aria-label="Écouter la note"></button>
        <p id="f-note" class="fin-touche"></p>
        <h2 id="f-titre"></h2>
        <p id="f-comp" class="f-comp"></p>
        <div id="f-clavier" class="grand-clavier fiche"></div>
        <p id="f-credit" class="credit"></p>
        <div class="f-actions">
          <button id="f-lecture" class="rond discret" aria-label="Lecture ou pause"></button>
          <button id="f-suite" class="bouton plein">Continuer</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.8.9/build/opensheetmusicdisplay.min.js"></script>
<script src="data/enregistrements.js?v=46"></script>
<script src="data/enregistrements-prive.js?v=46"></script>
<script src="data/pieces.js?v=46"></script>
<script src="app.js?v=46"></script>
<script src="plus.js?v=46"></script>
</body>
</html>
